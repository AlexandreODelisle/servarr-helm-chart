{{ $root := .Values }}
{{- range $storage, $config := .Values.storage.mounts }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $storage }}-mgmt
  labels:
    type: {{ $storage }}-mgmt
spec:
  storageClassName: ""
  capacity:
    storage: {{ $config.storage }}
  accessModes: {{ $config.accessModes }}
  mountOptions:
    - hard
    - nfsvers=4.0
    - nolock
    - rw
    - nodev  # Prevent the use of device files on the mount
    - nosuid # Ignore set-user-identifier bits
    - noexec # (Optional) Prevent binaries from running from the share
  nfs:
    server: {{ $root.storage.nfs.IPAddress }}
    path: {{ $config.path }}
{{- end }}
