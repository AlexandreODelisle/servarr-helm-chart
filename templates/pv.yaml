{{- range $name, $config := $.Values.global.storage }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}
  labels:
    type: {{ $name }}
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  capacity:
    storage: {{ $config.storage }}
  accessModes: {{ $config.accessModes }}
  mountOptions:
    - hard
    - nfsvers=4.0
    - nolock
    - rw
  nfs:
    server: {{ $.Values.global.nfs.IPAddress }}
    path: {{ $config.path }}
{{- end }}
