{{- range $service, $config := .Values.services }}
{{- if eq $.Values.global.network.expose.type "route"}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $service }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.global.network.gateway.name }}
      namespace: {{ $.Values.global.network.gateway.namespace }}
      sectionName: https
      group: gateway.networking.k8s.io	
      kind: Gateway
  hostnames:
    - {{ $service }}.{{ $.Values.global.network.domain }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $service }}
          namespace: {{ $.Release.Namespace }}
          port: 80
          weight: 1
          group: ''	
          kind: Service
{{- end }}
{{- end }}