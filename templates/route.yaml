{{ if eq .Values.global.network.expose.type "route" }}
{{- range $service, $config := .Values.services }}
{{- if $config.enabled -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $service }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway
      sectionName: http
      group: gateway.networking.k8s.io	
      kind: Gateway
  hostnames:
    - {{ $service }}.adelisle.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $service }}
          port: 80
          group: ''	
          kind: Service
{{- end -}}
{{- end }}
{{ end }}
